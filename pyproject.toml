[project]
name = "food-prices-platform"
version = "0.1.0"
description = "Kenya food prices & inflation data platform built on the World Bank RTFP dataset"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
# Apache Airflow is deliberately NOT listed here: it is installed in the Airflow
# image against the official constraints file (see docker/airflow/Dockerfile).
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "sqlalchemy>=1.4",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]   # long SQL strings; zip() strictness not needed
